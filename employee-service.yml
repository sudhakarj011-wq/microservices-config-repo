# ============================================================
# employee-service.yml — Centralized config for employee-service
# Config Server is file ko employee-service ko serve karega
# ============================================================

server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:           # ← Apna MySQL password yahan likho
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# JWT Secret — auth-service ke saath same hona chahiye
jwt:
  secret: mySecretKeyForJWTwhichMustBeAtLeast256BitsLongForHS256Algorithm

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.example.employee: DEBUG
    org.springframework.security: DEBUG
