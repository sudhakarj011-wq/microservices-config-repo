# ============================================================
# employee-service.yml — Centralized config for employee-service
# Config Server is file ko employee-service ko serve karega
# ============================================================

server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:           # ← Apna MySQL password yahan likho
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# JWT Secret — auth-service ke saath same hona chahiye
jwt:
  secret: mySecretKeyForJWTwhichMustBeAtLeast256BitsLongForHS256Algorithm

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.example.employee: DEBUG
    org.springframework.security: DEBUG

# ============================================================
# Resilience4j — Circuit Breaker (employee-service level)
#
# WHY yahan bhi? Gateway mein bhi hai!
#   Gateway CB: Network level — employee-service respond nahi kar raha
#   Employee-service CB: Application level — DB down/slow hai
#   Dono alag layers par protect karte hain (Defense in Depth)
# ============================================================
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s   # 3 second se zyada time laga toh timeout
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50          # 50% calls fail hone par OPEN
        slidingWindowSize: 10             # 10 calls ka window dekho
        waitDurationInOpenState: 10s      # 10s OPEN rehne ke baad HALF-OPEN
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
    instances:
      employee-db:        # DB calls ke liye circuit breaker
        baseConfig: default

# ============================================================
# Feign Client Logging (DEBUG mein dekho inter-service calls)
# ============================================================
feign:
  client:
    config:
      default:
        loggerLevel: BASIC   # REQUEST_URL + STATUS_CODE log hoga
