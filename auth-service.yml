# ============================================================
# auth-service.yml — Centralized config for auth-service
# Config Server is file ko auth-service ko serve karega
# ============================================================

server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:           # ← Apna MySQL password yahan likho
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt:
  secret: mySecretKeyForJWTwhichMustBeAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000   # 24 hours in milliseconds

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.example.auth: DEBUG
    org.springframework.security: DEBUG
