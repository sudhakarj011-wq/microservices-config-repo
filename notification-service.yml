server:
  port: 8086

spring:
  # ============================================================
  # Kafka Consumer Configuration
  # ============================================================
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.notification.event, com.example.employee.event, com.example.it.event"
        spring.json.value.default.type: "com.example.notification.event.SalaryIncrementEvent"
        spring.json.use.type.headers: true

  # ============================================================
  # Gmail SMTP Configuration
  # ============================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: jadhavsudhakar8@gmail.com
    password: !Cobne7070
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
